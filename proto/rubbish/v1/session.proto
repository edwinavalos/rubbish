syntax = "proto3";

package rubbish.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/edwinavalos/rubbish/gen/rubbish/v1;rubbishv1";

service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (Session);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
  rpc GetSessionTerminalURL(GetSessionTerminalURLRequest) returns (GetSessionTerminalURLResponse);
  rpc WatchSession(WatchSessionRequest) returns (stream SessionEvent);
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_STARTING = 1;
  SESSION_STATE_READY = 2;
  SESSION_STATE_STOPPING = 3;
  SESSION_STATE_STOPPED = 4;
  SESSION_STATE_FAILED = 5;
}

message SessionResources {
  int32 vcpus = 1;
  int32 memory_mib = 2;
}

message Session {
  string id = 1;
  string team_slug = 2;
  string user_slug = 3;
  string repo = 4;
  string worktree = 5;
  string terminal_url = 6;
  SessionState state = 7;
  SessionResources resources = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp ready_at = 10;
  google.protobuf.Timestamp stopped_at = 11;
}

message CreateSessionRequest {
  string team_slug = 1;
  string user_slug = 2;
  string repo_url = 3;
  string branch = 4;
  string image_id = 5;
  SessionResources resources = 6;
  bool write_enabled = 7;
}

message CreateSessionResponse {
  Session session = 1;
}

message GetSessionRequest {
  string session_id = 1;
}

message ListSessionsRequest {
  string team_slug = 1;
  string user_slug = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message StopSessionRequest {
  string session_id = 1;
}

message StopSessionResponse {}

message GetSessionTerminalURLRequest {
  string session_id = 1;
}

message GetSessionTerminalURLResponse {
  string terminal_url = 1;
}

message WatchSessionRequest {
  string session_id = 1;
}

message SessionEvent {
  Session session = 1;
}
