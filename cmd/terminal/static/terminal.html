<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rubbish › terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Color tokens (dark default) ── */
    :root {
      --bg:             #0f0f0f;
      --surface:        #0f0f0f;
      --border:         #1a1a1a;
      --text-primary:   #e0e0e0;
      --text-muted:     #6b7280;
      --text-dim:       #9ca3af;
      --text-sep:       #2a2a2a;
      --accent:         #7c3aed;
      --link:           #4b5563;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg:             #f3f4f6;
        --surface:        #ffffff;
        --border:         #e5e7eb;
        --text-primary:   #111827;
        --text-muted:     #6b7280;
        --text-dim:       #9ca3af;
        --text-sep:       #d1d5db;
        --accent:         #7c3aed;
        --link:           #9ca3af;
      }
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      font-size: 12px;
    }

    #topbar .title { color: var(--text-muted); }
    #topbar .title .logo { color: var(--accent); font-weight: 700; }
    #topbar .title .sep { margin: 0 6px; color: var(--text-sep); }
    #topbar .title .session-id { color: var(--text-dim); }

    #topbar a { color: var(--link); text-decoration: none; font-size: 12px; }
    #topbar a:hover { color: var(--accent); }

    #connStatus { font-size: 11px; color: var(--text-muted); margin-left: 8px; }

    /* ── Terminal container ── */
    #terminal-wrapper {
      position: absolute;
      top: 32px;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 4px;
    }

    #terminal { width: 100%; height: 100%; }

    /* ── Reconnect overlay ── */
    #reconnect-overlay {
      position: absolute;
      top: 32px;
      left: 0; right: 0; bottom: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      z-index: 10;
    }

    .reconnect-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .reconnect-msg {
      color: var(--text-muted);
      font-size: 13px;
    }

    .reconnect-card button {
      padding: 8px 22px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 0.01em;
    }

    .reconnect-card button:hover { opacity: 0.85; }
  </style>
</head>
<body>

<div id="topbar">
  <div class="title">
    <span class="logo">rubbish</span>
    <span class="sep">›</span>
    <span class="session-id" id="sessionLabel">—</span>
    <span id="connStatus"></span>
  </div>
  <a id="backLink" href="/">← Sessions</a>
</div>

<div id="reconnect-overlay">
  <div class="reconnect-card">
    <span class="reconnect-msg">Connection lost</span>
    <button onclick="connect()">Resume</button>
  </div>
</div>

<div id="terminal-wrapper">
  <div id="terminal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
  const id = location.pathname.split('/').filter(Boolean).pop();
  document.getElementById('sessionLabel').textContent = id || 'unknown';
  document.getElementById('backLink').href = `${location.protocol}//${location.hostname}:8080/`;
  document.title = `rubbish › ${id || 'terminal'}`;

  // ── Detect color scheme and pick xterm theme ───────────────────────────────
  const darkTheme = {
    background:         '#0f0f0f',
    foreground:         '#e0e0e0',
    cursor:             '#7c3aed',
    cursorAccent:       '#0f0f0f',
    selectionBackground:'#7c3aed44',
    black:   '#1a1a1a', brightBlack:   '#4b5563',
    red:     '#ef4444', brightRed:     '#f87171',
    green:   '#22c55e', brightGreen:   '#4ade80',
    yellow:  '#facc15', brightYellow:  '#fde047',
    blue:    '#3b82f6', brightBlue:    '#60a5fa',
    magenta: '#a855f7', brightMagenta: '#c084fc',
    cyan:    '#06b6d4', brightCyan:    '#22d3ee',
    white:   '#e5e7eb', brightWhite:   '#f9fafb',
  };

  const lightTheme = {
    background:         '#ffffff',
    foreground:         '#111827',
    cursor:             '#7c3aed',
    cursorAccent:       '#ffffff',
    selectionBackground:'#7c3aed33',
    black:   '#1f2937', brightBlack:   '#6b7280',
    red:     '#dc2626', brightRed:     '#ef4444',
    green:   '#16a34a', brightGreen:   '#22c55e',
    yellow:  '#d97706', brightYellow:  '#f59e0b',
    blue:    '#2563eb', brightBlue:    '#3b82f6',
    magenta: '#7c3aed', brightMagenta: '#a855f7',
    cyan:    '#0891b2', brightCyan:    '#06b6d4',
    white:   '#f3f4f6', brightWhite:   '#ffffff',
  };

  const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  const xtermTheme   = prefersLight ? lightTheme : darkTheme;

  // Keep xterm background in sync with the page bg when scheme changes
  document.querySelector('.xterm-viewport') && (document.querySelector('.xterm-viewport').style.background = xtermTheme.background);

  // ── Terminal setup ─────────────────────────────────────────────────────────
  const term = new Terminal({
    cursorBlink: true,
    fontSize: 14,
    fontFamily: "'Menlo', 'Monaco', 'Consolas', monospace",
    theme: xtermTheme,
    allowProposedApi: true,
  });

  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));
  fitAddon.fit();
  term.focus();

  // ── Clipboard ──────────────────────────────────────────────────────────────
  // navigator.clipboard requires HTTPS; fallbackCopy works on plain HTTP too.
  function copyText(text) {
    if (!text) return;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
  }

  function sendText(text) {
    if (text && ws && ws.readyState === WebSocket.OPEN) ws.send(text);
  }

  // Copy selected text on mouseup (more reliable than onSelectionChange which
  // fires on every mouse-move during selection).
  document.getElementById('terminal').addEventListener('mouseup', () => {
    const sel = term.getSelection();
    if (sel) copyText(sel);
  });

  // Native paste event works on HTTP (no Clipboard API permission needed).
  // Catches Ctrl+V / Cmd+V at the OS level and right-click → Paste.
  document.addEventListener('paste', e => {
    const text = e.clipboardData?.getData('text');
    if (text) { e.preventDefault(); sendText(text); }
  });

  // Right-click: suppress browser menu; try Clipboard API (HTTPS) then
  // fall back to prompting — better than silently doing nothing.
  document.getElementById('terminal').addEventListener('contextmenu', e => {
    e.preventDefault();
    if (navigator.clipboard) {
      navigator.clipboard.readText().then(sendText).catch(() => {});
    }
    // On HTTP the native paste event (above) handles right-click → Paste
    // in browsers that route it through the paste event.
  });

  // Ctrl+Shift+C / Cmd+C: explicit copy shortcut.
  term.attachCustomKeyEventHandler(e => {
    if (e.type !== 'keydown') return true;

    // Shift+Enter: send \n so Claude Code inserts a newline instead of
    // submitting. xterm.js sends \r for both Enter and Shift+Enter by default.
    if (e.code === 'Enter' && e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
      sendText('\n');
      return false;
    }

    if ((e.ctrlKey && e.shiftKey && e.code === 'KeyC') ||
        (e.metaKey && e.code === 'KeyC' && term.getSelection().length > 0)) {
      copyText(term.getSelection());
      return false;
    }
    // Ctrl+Shift+V / Cmd+V: explicit paste shortcut (HTTPS only; HTTP uses
    // the native paste event handler above instead).
    if ((e.ctrlKey && e.shiftKey && e.code === 'KeyV') || (e.metaKey && e.code === 'KeyV')) {
      if (navigator.clipboard) {
        navigator.clipboard.readText().then(sendText).catch(() => {});
        return false;
      }
      // On HTTP, let the keydown propagate so the browser fires the paste event.
      return true;
    }
    return true;
  });

  // Sync xterm viewport background (xterm injects it after open())
  const viewport = document.querySelector('.xterm-viewport');
  if (viewport) viewport.style.background = xtermTheme.background;

  // If the user changes their OS theme mid-session, update everything
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
    const t = e.matches ? lightTheme : darkTheme;
    term.options.theme = t;
    const vp = document.querySelector('.xterm-viewport');
    if (vp) vp.style.background = t.background;
  });

  // ── WebSocket ──────────────────────────────────────────────────────────────
  let ws;
  let autoReconnecting = false;
  let reconnectAttempts = 0;
  let reconnectTimer = null;
  const RECONNECT_DELAYS = [300, 500, 800, 1200, 2000, 3000];
  const MAX_RECONNECT_ATTEMPTS = 20;

  const reconnectOverlay = document.getElementById('reconnect-overlay');
  const connStatus = document.getElementById('connStatus');

  function setStatus(text) { if (connStatus) connStatus.textContent = text; }

  function scheduleReconnect() {
    if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
      autoReconnecting = false;
      setStatus('');
      reconnectOverlay.style.display = 'flex';
      return;
    }
    const delay = RECONNECT_DELAYS[Math.min(reconnectAttempts, RECONNECT_DELAYS.length - 1)];
    reconnectAttempts++;
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, delay);
  }

  function connect() {
    reconnectOverlay.style.display = 'none';
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/${id}`);
    ws.binaryType = 'arraybuffer';

    // Track whether the upgrade handshake succeeded. If the server rejects
    // (e.g. 503 "session not ready"), onopen never fires and wsOpened stays
    // false — we treat that as "VM still booting" and auto-retry silently.
    let wsOpened = false;

    ws.onopen = () => {
      wsOpened = true;
      autoReconnecting = false;
      reconnectAttempts = 0;
      setStatus('');
      sendResize();
    };

    ws.onmessage = e => {
      if (typeof e.data === 'string') {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'reconnect') {
            autoReconnecting = true;
            setStatus('reconnecting…');
            return;
          }
        } catch (_) {}
        term.write(e.data);
        return;
      }
      term.write(new Uint8Array(e.data));
    };

    ws.onclose = () => {
      if (autoReconnecting) { scheduleReconnect(); return; }
      if (!wsOpened) {
        // Server rejected before upgrade — VM not ready yet. Auto-retry
        // without showing the overlay; print the message only on the first attempt.
        if (reconnectAttempts === 1) {
          term.write('\x1b[33mWaiting for VM to be ready…\x1b[0m\r\n');
        }
        scheduleReconnect();
        return;
      }
      term.write('\r\n\x1b[31m[Connection closed]\x1b[0m\r\n');
      reconnectOverlay.style.display = 'flex';
    };

    ws.onerror = () => {
      if (autoReconnecting || !wsOpened) return; // onclose handles the retry
      term.write('\r\n\x1b[31m[WebSocket error — connection failed]\x1b[0m\r\n');
      reconnectOverlay.style.display = 'flex';
    };
  }

  // ── Input ──────────────────────────────────────────────────────────────────
  term.onData(data => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(data);
  });

  // ── Resize ─────────────────────────────────────────────────────────────────
  function sendResize() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { fitAddon.fit(); sendResize(); }, 50);
  });

  connect();
</script>
</body>
</html>
