<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rubbish</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Color tokens (dark default) ── */
    :root {
      --bg:              #0f0f0f;
      --surface:         #111111;
      --surface-input:   #0f0f0f;
      --border:          #1e1e1e;
      --border-strong:   #2a2a2a;
      --text-primary:    #e0e0e0;
      --text-secondary:  #d1d5db;
      --text-muted:      #9ca3af;
      --text-dim:        #6b7280;
      --text-dimmer:     #4b5563;
      --text-placeholder:#374151;
      --text-empty:      #333333;
      --text-heading:    #f3f4f6;
      --modal-backdrop:  rgba(0,0,0,0.72);
      --accent:          #7c3aed;
      --accent-hover:    #6d28d9;
      --status-ready:    #22c55e;
      --status-starting: #facc15;
      --status-failed:   #ef4444;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg:              #f3f4f6;
        --surface:         #ffffff;
        --surface-input:   #f9fafb;
        --border:          #e5e7eb;
        --border-strong:   #d1d5db;
        --text-primary:    #111827;
        --text-secondary:  #374151;
        --text-muted:      #6b7280;
        --text-dim:        #9ca3af;
        --text-dimmer:     #9ca3af;
        --text-placeholder:#d1d5db;
        --text-empty:      #d1d5db;
        --text-heading:    #111827;
        --modal-backdrop:  rgba(0,0,0,0.45);
        --accent:          #7c3aed;
        --accent-hover:    #6d28d9;
        --status-ready:    #16a34a;
        --status-starting: #d97706;
        --status-failed:   #dc2626;
      }
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 52px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .btn-new {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-new:hover { background: var(--accent-hover); }

    .nav-link { color: var(--text-muted); text-decoration: none; font-size: 12px; }
    .nav-link:hover { color: var(--text-secondary); }

    /* ── Body layout ── */
    .body-layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ── Sidebar ── */
    aside {
      width: 228px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      padding: 20px 0 0;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-title {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .btn-fav-add {
      background: transparent;
      border: none;
      color: var(--text-dimmer);
      font-size: 16px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }
    .btn-fav-add:hover { color: var(--accent); }

    .favorites-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .fav-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 8px 16px;
      cursor: default;
      border-radius: 0;
      transition: background 0.1s;
    }
    .fav-card:hover { background: var(--bg); }

    .fav-info {
      flex: 1;
      min-width: 0;
    }
    .fav-name {
      font-size: 12px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .fav-meta {
      font-size: 10px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 1px;
    }
    .fav-meta .branch-tag { color: var(--accent); }

    .fav-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .fav-card:hover .fav-actions { opacity: 1; }

    .btn-fav-launch {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 2px 7px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-fav-launch:hover { background: var(--accent); color: #fff; }

    .btn-fav-del {
      background: transparent;
      color: var(--text-dimmer);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
    }
    .btn-fav-del:hover { color: var(--status-failed); border-color: var(--status-failed); }

    .sidebar-empty {
      padding: 24px 16px;
      font-size: 11px;
      color: var(--text-empty);
      text-align: center;
      line-height: 1.5;
    }

    /* ── Main ── */
    main {
      flex: 1;
      padding: 28px 32px;
      min-width: 0;
      overflow-y: auto;
    }

    .section-title {
      font-size: 12px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    /* ── Session cards ── */
    .sessions-list { display: flex; flex-direction: column; gap: 8px; }

    .session-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
    }
    .session-card.dimmed { opacity: 0.45; }

    .role-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid;
    }
    .role-badge.research { color: #38bdf8; border-color: #38bdf8; }
    .role-badge.plan     { color: #a78bfa; border-color: #a78bfa; }
    .role-badge.implement{ color: #fb923c; border-color: #fb923c; }

    .status-dot {
      flex-shrink: 0;
      font-size: 12px;
      width: 14px;
      text-align: center;
    }
    .status-dot.ready    { color: var(--status-ready); }
    .status-dot.failed   { color: var(--status-failed); }
    .status-dot.stopped  { color: var(--status-failed); }
    .status-dot.provisioning,
    .status-dot.booting,
    .status-dot.waiting_ssh,
    .status-dot.configuring,
    .status-dot.starting { color: var(--status-starting); animation: pulse 1.2s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .session-id {
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 12px;
      width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-repo {
      flex: 1;
      overflow: hidden;
      min-width: 0;
    }
    .session-repo-name {
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-repo-branch {
      font-size: 11px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-repo-branch .branch-tag {
      color: var(--accent);
      font-weight: 600;
    }
    .session-status {
      flex-shrink: 0;
      width: 76px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }
    .session-status.ready    { color: var(--status-ready); }
    .session-status.failed   { color: var(--status-failed); }
    .session-status.provisioning,
    .session-status.booting,
    .session-status.waiting_ssh,
    .session-status.configuring,
    .session-status.starting { color: var(--status-starting); }
    .session-age {
      flex-shrink: 0;
      font-size: 11px;
      color: var(--text-dimmer);
      width: 52px;
      text-align: right;
    }
    .session-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }

    .btn-open {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 3px 10px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn-open:hover { background: var(--accent); color: #fff; }

    .btn-dismiss {
      background: transparent;
      color: var(--text-dimmer);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-dismiss:hover { color: var(--status-failed); border-color: var(--status-failed); }

    .btn-start {
      background: transparent;
      color: var(--status-ready);
      border: 1px solid var(--status-ready);
      padding: 3px 10px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-start:hover { background: var(--status-ready); color: #fff; }

    .btn-star {
      background: transparent;
      border: none;
      color: var(--text-dimmer);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      line-height: 1;
      transition: color 0.15s;
    }
    .btn-star:hover { color: #facc15; }
    .btn-star.starred { color: #facc15; }
    .btn-star.flash { color: var(--status-ready); }

    .empty-state {
      color: var(--text-empty);
      font-size: 13px;
      padding: 40px 0;
      text-align: center;
    }

    /* ── Modal ── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--modal-backdrop);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 28px;
      width: 440px;
      max-width: calc(100vw - 32px);
    }
    .modal h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-heading);
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .field input {
      width: 100%;
      background: var(--surface-input);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      padding: 8px 10px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--text-placeholder); }
    .field-hint {
      font-size: 11px;
      color: var(--text-dimmer);
      margin-top: 5px;
    }

    .modal-status {
      font-size: 12px;
      color: var(--status-starting);
      min-height: 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-error { color: var(--status-failed); }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid var(--status-starting);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }
    .btn-cancel {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border-strong);
      padding: 7px 16px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-cancel:hover { color: var(--text-primary); border-color: var(--text-muted); }
    .btn-launch {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 7px 16px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-launch:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-launch:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>

<header>
  <span class="logo">rubbish</span>
  <nav style="display:flex;gap:16px;margin-left:16px;">
    <a href="/orchestrator" class="nav-link">orchestrator</a>
    <a href="/profile" class="nav-link">profile</a>
  </nav>
  <button class="btn-new" id="btnNew">+ New Session</button>
</header>

<div class="body-layout">
  <!-- Favorites sidebar -->
  <aside>
    <div class="sidebar-header">
      <span class="sidebar-title">Favorites</span>
      <button class="btn-fav-add" id="btnFavAdd" title="Add favorite">+</button>
    </div>
    <div class="favorites-list" id="favoritesList">
      <div class="sidebar-empty">No favorites yet.<br>Star a session to save it.</div>
    </div>
  </aside>

  <!-- Session list -->
  <main>
    <div class="section-title" id="sectionTitle">Sessions</div>
    <div class="sessions-list" id="sessionsList">
      <div class="empty-state">No active sessions.</div>
    </div>
  </main>
</div>

<!-- New Session Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2>New Session</h2>
    <div class="field">
      <label>Repo URL <span style="color:var(--text-dimmer)">(optional)</span></label>
      <input type="url" id="inputRepo" placeholder="https://github.com/user/repo">
    </div>
    <div class="field">
      <label>Branch / Worktree <span style="color:var(--text-dimmer)">(optional)</span></label>
      <input type="text" id="inputBranch" placeholder="main">
      <div class="field-hint">Leave blank to clone the default branch.</div>
    </div>

    <div class="field" style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
      <input type="checkbox" id="inputDevMode" style="width:auto;accent-color:var(--accent);cursor:pointer;">
      <label for="inputDevMode" style="text-transform:none;letter-spacing:0;font-size:12px;color:var(--text-muted);cursor:pointer;margin:0;">
        Dev mode — inject Claude memories + deploy key
      </label>
    </div>

    <div class="modal-status" id="modalStatus">
      <span class="spinner" id="spinner"></span>
      <span id="statusText"></span>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancel">Cancel</button>
      <button class="btn-launch" id="btnLaunch">Launch Session</button>
    </div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);

  const TERMINAL_STATES    = new Set(['stopped', 'failed']);
  const IN_PROGRESS_STATES = new Set(['provisioning', 'booting', 'waiting_ssh', 'configuring']);

  const STATUS_LABEL = {
    provisioning: 'provisioning',
    booting:      'booting',
    waiting_ssh:  'waiting ssh',
    configuring:  'configuring',
    ready:        'ready',
    stopping:     'stopping',
    stopped:      'stopped',
    failed:       'failed',
  };

  // ── Favorites ─────────────────────────────────────────────────────────────

  let favoritesById = {};

  async function loadFavorites() {
    try {
      const res = await fetch('/api/favorites');
      if (!res.ok) return;
      const favs = await res.json();
      favoritesById = {};
      (favs || []).forEach(f => { favoritesById[f.id] = f; });
      renderFavorites(favs);
    } catch (e) { /* ignore */ }
  }

  function renderFavorites(favs) {
    const list = $('favoritesList');
    if (!favs || favs.length === 0) {
      list.innerHTML = '<div class="sidebar-empty">No favorites yet.<br>Star a session to save it.</div>';
      return;
    }
    list.innerHTML = favs.map(f => {
      const repo = repoDisplay(f.repo_url);
      const meta = repo
        ? (f.branch ? `${repo} <span class="branch-tag">⎇ ${f.branch}</span>` : repo)
        : '<span style="color:var(--text-placeholder)">no repo</span>';
      return `
        <div class="fav-card">
          <div class="fav-info">
            <div class="fav-name" title="${f.name}">${truncate(f.name, 22)}</div>
            <div class="fav-meta">${meta}</div>
          </div>
          <div class="fav-actions">
            <button class="btn-fav-launch" onclick="launchFromFavorite('${f.id}')">▶</button>
            <button class="btn-fav-del" onclick="deleteFavorite('${f.id}')">✕</button>
          </div>
        </div>`;
    }).join('');
  }

  async function deleteFavorite(id) {
    try {
      await fetch(`/api/favorites/${id}`, { method: 'DELETE' });
    } catch (e) { /* ignore */ }
    await loadFavorites();
  }

  async function starSession(sessionId, btn) {
    try {
      const res = await fetch(`/api/sessions/${sessionId}/favorite`, { method: 'POST' });
      if (!res.ok) return;
      btn.textContent = '★';
      btn.classList.add('starred');
      await loadFavorites();
    } catch (e) { /* ignore */ }
  }

  function launchFromFavorite(id) {
    const f = favoritesById[id];
    if (f) openModal(f.repo_url, f.branch);
  }

  // ── Session list polling ──────────────────────────────────────────────────

  let pollTimer = null;
  let launchingId = null;

  function startPolling() {
    loadSessions();
    loadFavorites();
    pollTimer = setInterval(loadSessions, 2000);
  }

  async function loadSessions() {
    try {
      const res = await fetch('/api/sessions');
      if (!res.ok) return;
      const sessions = await res.json();
      renderSessions(sessions);

      if (launchingId) {
        const s = sessions.find(s => s.id === launchingId);
        if (s && s.status === 'ready') {
          onLaunchReady(s);
        } else if (s && (s.status === 'failed' || s.status === 'stopped')) {
          onLaunchFailed(s.error || 'Session failed to start.');
        }
      }
    } catch (e) { /* network error, will retry */ }
  }

  function timeAgo(isoStr) {
    if (!isoStr) return '';
    const diff = Math.floor((Date.now() - new Date(isoStr)) / 1000);
    if (diff < 60)  return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    return `${Math.floor(diff/3600)}h ago`;
  }

  function repoDisplay(url) {
    if (!url) return null;
    const m = url.match(/github\.com[/:]([^/]+\/[^/]+?)(?:\.git)?$/);
    if (m) return m[1];
    return url.replace(/^https?:\/\//, '');
  }

  function truncate(str, max) {
    if (!str) return '—';
    return str.length > max ? str.slice(0, max) + '…' : str;
  }

  function renderSessions(sessions) {
    const list = $('sessionsList');
    const active = sessions.filter(s => !TERMINAL_STATES.has(s.status));
    const count = active.length;

    $('sectionTitle').textContent = count === 1
      ? 'Sessions (1 active)'
      : `Sessions (${count} active)`;

    if (sessions.length === 0) {
      list.innerHTML = '<div class="empty-state">No active sessions. Launch one to get started.</div>';
      return;
    }

    list.innerHTML = sessions.map(s => {
      const isDimmed = s.status === 'failed';
      const dotChar = s.status === 'ready' ? '●' : IN_PROGRESS_STATES.has(s.status) ? '○' : '✕';
      const shortId = s.id.split('-')[0];
      const hasRepo = !!s.repo_url;

      const starBtn = hasRepo
        ? `<button class="btn-star" title="Save as favorite" onclick="starSession('${s.id}', this)">☆</button>`
        : '';

      let actions;
      if (s.status === 'ready') {
        actions = `<a class="btn-open" href="http://${location.hostname}:8081/terminal/${s.id}">Open</a>
           ${starBtn}
           <button class="btn-dismiss" data-id="${s.id}" onclick="dismissSession('${s.id}')">✕</button>`;
      } else if (s.status === 'stopped') {
        actions = `<button class="btn-start" onclick="startSession('${s.id}')">Start</button>
           ${starBtn}
           <button class="btn-dismiss" data-id="${s.id}" onclick="dismissSession('${s.id}')">✕</button>`;
      } else {
        actions = `${starBtn}<button class="btn-dismiss" data-id="${s.id}" onclick="dismissSession('${s.id}')">✕</button>`;
      }

      const repo = repoDisplay(s.repo_url);
      const repoHtml = repo
        ? `<div class="session-repo-name" title="${s.repo_url}">${truncate(repo, 40)}</div>
           <div class="session-repo-branch">${s.branch ? `<span class="branch-tag">⎇ ${s.branch}</span>` : '<span style="color:var(--text-placeholder)">default branch</span>'}</div>`
        : `<div class="session-repo-name" style="color:var(--text-placeholder)">no repo</div>`;

      const AGENT_ROLES = { research: 'research', plan: 'plan', implement: 'implement' };
      const roleBadge = AGENT_ROLES[s.role]
        ? `<span class="role-badge ${s.role}">${s.role}</span>`
        : '';

      return `
        <div class="session-card ${isDimmed ? 'dimmed' : ''}">
          <span class="status-dot ${s.status}">${dotChar}</span>
          <span class="session-id" title="${s.id}">${shortId}</span>
          ${roleBadge}
          <div class="session-repo">${repoHtml}</div>
          <span class="session-status ${s.status}">${STATUS_LABEL[s.status] || s.status}</span>
          <span class="session-age">${timeAgo(s.created_at)}</span>
          <span class="session-actions">${actions}</span>
        </div>`;
    }).join('');
  }

  async function dismissSession(id) {
    try {
      await fetch(`/api/sessions/${id}`, { method: 'DELETE' });
    } catch (e) { /* ignore */ }
    await loadSessions();
  }

  async function startSession(id) {
    try {
      await fetch(`/api/sessions/${id}/start`, { method: 'POST' });
    } catch (e) { /* ignore */ }
    await loadSessions();
  }

  // ── Modal ─────────────────────────────────────────────────────────────────

  function openModal(prefillRepo, prefillBranch) {
    const isNew = prefillRepo == null;
    $('inputRepo').value    = isNew ? 'git@github.com:edwinavalos/rubbish.git' : prefillRepo;
    $('inputBranch').value  = prefillBranch || '';
    $('inputDevMode').checked = isNew;
    setModalStatus('', false);
    $('btnLaunch').disabled = false;
    $('modalBackdrop').classList.add('open');
    $('inputRepo').focus();
  }

  function closeModal() {
    launchingId = null;
    $('modalBackdrop').classList.remove('open');
    $('btnLaunch').disabled = false;
    setModalStatus('', false);
    loadSessions();
  }

  function setModalStatus(msg, loading, isError) {
    $('statusText').textContent = msg;
    $('statusText').className = isError ? 'modal-error' : '';
    $('spinner').style.display = loading ? 'block' : 'none';
  }

  async function launchSession() {
    const repoUrl = $('inputRepo').value.trim();
    const branch  = $('inputBranch').value.trim();
    const devMode = $('inputDevMode').checked;

    $('btnLaunch').disabled = true;
    setModalStatus('Starting VM…', true);

    try {
      const res = await fetch('/api/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ repo_url: repoUrl || null, branch: branch || null, dev_mode: devMode }),
      });

      if (!res.ok) {
        const body = await res.text();
        throw new Error(body || `HTTP ${res.status}`);
      }

      const data = await res.json();
      launchingId = data.id;
      setModalStatus('Starting VM…', true);
    } catch (e) {
      setModalStatus(e.message, false, true);
      $('btnLaunch').disabled = false;
    }
  }

  function onLaunchReady(session) {
    launchingId = null;
    setModalStatus('', false);
    $('modalBackdrop').classList.remove('open');
    loadSessions();
    location.href = `http://${location.hostname}:8081/terminal/${session.id}`;
  }

  function onLaunchFailed(msg) {
    launchingId = null;
    setModalStatus(msg, false, true);
    $('btnLaunch').disabled = false;
  }

  // ── Event listeners ───────────────────────────────────────────────────────

  $('btnNew').addEventListener('click', () => openModal());
  $('btnFavAdd').addEventListener('click', () => openModal());
  $('btnCancel').addEventListener('click', closeModal);
  $('btnLaunch').addEventListener('click', launchSession);

  $('modalBackdrop').addEventListener('click', e => {
    if (e.target === $('modalBackdrop')) closeModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  startPolling();
</script>
</body>
</html>
